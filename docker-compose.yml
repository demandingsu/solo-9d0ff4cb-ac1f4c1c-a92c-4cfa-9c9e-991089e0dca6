services:
  # 本地示例时刻网站：浏览器访问 http://localhost:5001/
  example-site:
    build: ./example-site
    container_name: shuttle-example-site
    ports:
      - "5001:5001"

  # 末班核定 Web 应用：浏览器访问 http://localhost:8000/
  # 容器内通过服务名 example-site 访问示例网站，首页 URL 填：
  #   http://example-site:5001/
  commuter:
    build: ./app
    container_name: shuttle-commuter
    ports:
      - "8000:5000"
    depends_on:
      - example-site
